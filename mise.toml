[hooks]
postinstall = ["lefthook install", "npm install"]

[tasks."install:docker:plugin"]
hide = true
run = [
  'install -d "${DOCKER_CONFIG:-$HOME/.docker}/cli-plugins"',
  'ln -sf "${MISE_TOOL_INSTALL_PATH:?}/${usage_binary:?}" "${DOCKER_CONFIG:-$HOME/.docker}/cli-plugins/${usage_plugin:?}"',
]
usage = 'arg "<plugin>"; arg "<binary>"'

[tools]
adr-tools = "3.0.0"
docker-cli = "29.9.2"
editorconfig-checker = "4.0.2"
jactionlint = "2.2.0"
lefthook = "2.1.17"
node = "24.22.0"
"npm:cspell" = "9.2.1"
"npm:markdownlint-cli2" = "0.24.0"
"npm:prettier" = "3.9.6"
"pipx:commit-check" = "2.17.0"
"pipx:yamllint" = "1.38.0"
taplo = "0.10.0"
zizmor = "1.30.1"

[tools.docker-compose]
postinstall = { run = "mise run --skip-tools install:docker:plugin docker-compose docker-compose", when = "always" }
version = "5.6.1"

[tools."github:docker/buildx"]
postinstall = { run = "mise run --skip-tools install:docker:plugin docker-buildx buildx", when = "always" }
version = "0.38.1"
