---
jobs:
  commit-check:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: commit-check/commit-check-action@v2
        with:
          author-email: true
          author-name: true
          branch: true
          message: true
name: Commit Check
'on':
  pull_request:
    branches: main
