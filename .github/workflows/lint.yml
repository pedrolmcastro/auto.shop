---
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
defaults:
  run:
    shell: bash
jobs:
  lint:
    name: lint
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          escape_json: false
          files_yaml: |
            actions:
              - .github/actions/**/*.yml
              - .github/actions/**/*.yaml
              - .github/workflows/*.yml
              - .github/workflows/*.yaml
            any:
              - '**'
            json:
              - '**/*.json'
            markdown:
              - '**/*.md'
            toml:
              - '**/*.toml'
            xml:
              - '**/*.xml'
            yaml:
              - '**/*.yaml'
              - '**/*.yml'
              - .yamllint
          json: true
      - if: ${{ steps.changed-files.outputs.any_any_changed == 'true' }}
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          cache: true
      - env:
          FILES: ${{ steps.changed-files.outputs.actions_all_changed_files }}
        if: ${{ steps.changed-files.outputs.actions_any_changed == 'true' }}
        run: |
          files=$(jq -er '.[]' <<< "$FILES")
          mapfile -t files <<< "$files"
          jactionlint --profile pedantic -- "${files[@]}"
      - env:
          FILES: ${{ steps.changed-files.outputs.any_all_changed_files }}
        if: ${{ steps.changed-files.outputs.any_any_changed == 'true' }}
        run: |
          files=$(jq -er '.[]' <<< "$FILES")
          mapfile -t files <<< "$files"
          cspell --no-progress "${files[@]}"
          editorconfig-checker "${files[@]}"
      - env:
          FILES: ${{ steps.changed-files.outputs.json_all_changed_files }}
        if: ${{ steps.changed-files.outputs.json_any_changed == 'true' }}
        run: |
          files=$(jq -er '.[]' <<< "$FILES")
          mapfile -t files <<< "$files"
          prettier --log-level warn --check "${files[@]}"
      - env:
          FILES: ${{ steps.changed-files.outputs.markdown_all_changed_files }}
        if: ${{ steps.changed-files.outputs.markdown_any_changed == 'true' }}
        run: |
          files=$(jq -er '.[]' <<< "$FILES")
          mapfile -t files <<< "$files"
          markdownlint-cli2 "${files[@]}"
      - env:
          FILES: ${{ steps.changed-files.outputs.toml_all_changed_files }}
        if: ${{ steps.changed-files.outputs.toml_any_changed == 'true' }}
        run: |
          files=$(jq -er '.[]' <<< "$FILES")
          mapfile -t files <<< "$files"
          RUST_LOG=warn taplo check -- "${files[@]}"
          RUST_LOG=warn taplo fmt --check -- "${files[@]}"
      - env:
          FILES: ${{ steps.changed-files.outputs.xml_all_changed_files }}
        if: ${{ steps.changed-files.outputs.xml_any_changed == 'true' }}
        run: |
          files=$(jq -er '.[]' <<< "$FILES")
          mapfile -t files <<< "$files"
          xmllint --noout "${files[@]}"
      - env:
          FILES: ${{ steps.changed-files.outputs.yaml_all_changed_files }}
        if: ${{ steps.changed-files.outputs.yaml_any_changed == 'true' }}
        run: |
          files=$(jq -er '.[]' <<< "$FILES")
          mapfile -t files <<< "$files"
          yamllint --strict "${files[@]}"
    timeout-minutes: 5
name: Lint
'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
