---
name: 'Semantic Pull Request'
"on":
  pull_request_target:
    types:
      - edited
      - opened
      - reopened
      - synchronize
jobs:
  semantic-pull-request:
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            Pull request title "{title}" is invalid, subject "{subject}" must
            not start with an uppercase character
          validateSingleCommit: true
          validateSingleCommitMatchesPrTitle: true
