---
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
defaults:
  run:
    shell: bash
    working-directory: api
jobs:
  build-api:
    name: build-api
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25.0.5+8
      - env:
          MISE_NO_HOOKS: '1'
        name: Set up Docker
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          cache: true
          install_args: docker-cli docker-compose github:docker/buildx
      - name: Generate PostgreSQL password
        run: |
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          echo "POSTGRES_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Validate Docker
        run: docker compose config --quiet
      - env:
          PR_BASE: ${{ github.base_ref }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        name: Run checks
        run: |
          args=(check jacocoTestReport)
          if [[ -n "$SONAR_TOKEN" ]]; then
            args+=(sonar -Dsonar.qualitygate.timeout=300 -Dsonar.qualitygate.wait=true)
            if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
              args+=(
                "-Dsonar.pullrequest.base=$PR_BASE"
                "-Dsonar.pullrequest.branch=$PR_BRANCH"
                "-Dsonar.pullrequest.key=$PR_NUMBER"
              )
            fi
          fi
          ./gradlew --no-daemon "${args[@]}" --info
      - if: ${{ !cancelled() }}
        name: Upload reports
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          if-no-files-found: warn
          name: reports
          path: |
            api/build/reports
            api/build/test-results
          retention-days: 7
      - name: Build
        run: docker compose build app
      - env:
          PORT: '8080'
        name: Smoke test
        run: |
          docker compose up --detach --no-build app
          status=$(curl \
            --max-time 2 \
            --output /dev/null \
            --retry 30 \
            --retry-all-errors \
            --retry-delay 2 \
            --retry-max-time 60 \
            --show-error \
            --silent \
            --write-out '%{http_code}' \
            "http://127.0.0.1:${PORT}/")
          test "$status" -ge 200 && test "$status" -lt 500
          docker compose exec --user app -T app test -r /app/secrets/jwt-private.pem
          docker compose exec --user app -T app test -r /app/secrets/jwt-public.pem
          docker compose exec --user app -T app test -r /app/secrets/pepper.bin
        timeout-minutes: 2
      - if: ${{ always() }}
        name: Clean up
        run: |
          docker compose logs app
          docker compose down --remove-orphans --volumes
    timeout-minutes: 30
name: Build API
'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
