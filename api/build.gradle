plugins {
    id 'checkstyle'
    id 'com.diffplug.spotless' version '8.10.4'
    id 'com.github.spotbugs' version '6.5.13'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id 'java'
    id 'net.ltgt.errorprone' version '5.1.1'
    id 'org.jooq.jooq-codegen-gradle' version '3.21.9'
    id "org.sonarqube" version "7.5.0.8588"
    id 'org.springframework.boot' version '4.1.2'
}

sourceSets {
    integrationTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

checkstyle {
    toolVersion = '14.3.0'
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

configurations.configureEach {
    resolutionStrategy.eachDependency {
        if (
            it.requested.group == 'ch.qos.logback' &&
            (it.requested.name == 'logback-classic' || it.requested.name == 'logback-core')
        ) {
            it.because 'Fixes CVE-2026-104721'
            it.useVersion '1.6.5'
        }
        if (it.requested.group == 'com.google.guava' && it.requested.name == 'guava') {
            it.because 'Fixes CVE-2026-102554'
            it.useVersion '33.7.2-jre'
        }
    }
}

dependencies {
    compileOnly 'org.jspecify:jspecify:1.0.0'
    errorprone 'com.google.errorprone:error_prone_core:2.48.0'
    errorprone 'com.uber.nullaway:nullaway:0.14.1'
    implementation 'com.github.f4b6a3:uuid-creator:6.1.1'
    implementation 'com.password4j:password4j:1.8.4'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-jooq'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    integrationTestImplementation 'org.springframework.boot:spring-boot-testcontainers'
    integrationTestImplementation 'org.testcontainers:testcontainers-postgresql'
    jooqCodegen 'org.jooq:jooq-meta-extensions:3.21.9'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    spotbugsPlugins 'com.h3xstream.findsecbugs:findsecbugs-plugin:1.14.0'
    testImplementation 'com.tngtech.archunit:archunit-junit6:1.5.1'
    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'net.minidev', module: 'json-smart'
    }
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

group = 'shop.auto'

jacoco {
    toolVersion = '0.8.16'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

jooq {
    configuration {
        generator {
            database {
                inputSchema = 'identity'
                name = 'org.jooq.meta.extensions.ddl.DDLDatabase'
                properties {
                    property {
                        key = 'defaultNameCase'
                        value = 'lower'
                    }
                    property {
                        key = 'scripts'
                        value = 'src/main/resources/db/migration/*.sql'
                    }
                    property {
                        key = 'sort'
                        value = 'flyway'
                    }
                }
            }
            generate {
                generatedAnnotation = true
                generatedAnnotationDate = false
                generatedAnnotationJooqVersion = false
                generatedAnnotationType = org.jooq.meta.jaxb.GeneratedAnnotationType.ORG_JOOQ_GENERATED
            }
            target {
                packageName = 'shop.auto.api.modules.identity.infrastructure.generated.jooq'
            }
        }
    }
}

repositories {
    mavenCentral()
}

sonar {
    properties {
        property "sonar.coverage.jacoco.xmlReportPaths", layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml').get().asFile.absolutePath
        property "sonar.organization", "pedrolmcastro"
        property "sonar.projectKey", "pedrolmcastro_auto.shop"
        property "sonar.projectName", "api.auto.shop"
    }
}

spotbugs {
    excludeFilter = file('config/spotbugs/exclude.xml')
    toolVersion = '4.10.5'
}

spotless {
    java {
        eclipse('4.41').configFile('config/formatter/java-formatter.xml')
        lineEndings com.diffplug.spotless.LineEnding.UNIX
        target 'src/**/*.java'
        trimTrailingWhitespace()
    }
}

tasks.register('integrationTest', Test) {
    classpath = sourceSets.integrationTest.runtimeClasspath
    description = 'Runs integration tests.'
    group = 'verification'
    shouldRunAfter tasks.named('test')
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
}

tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}

tasks.named('check') {
    dependsOn tasks.named('integrationTest')
    dependsOn tasks.named('jacocoTestReport')
}

tasks.named('checkstyleMain') {
    exclude '**/infrastructure/generated/jooq/**'
}

tasks.named('compileJava') {
    dependsOn tasks.named('jooqCodegen')
}

tasks.named('jacocoTestReport', JacocoReport) {
    dependsOn tasks.named('integrationTest'), tasks.named('test')
    executionData tasks.named('integrationTest').get(), tasks.named('test').get()
    reports {
        html.required = true
        xml.required = true
    }
}

tasks.named('jooqCodegen') {
    inputs.files(fileTree('src/main/resources/db/migration') { include '*.sql' })
}

tasks.named('sonar') {
    dependsOn tasks.named('jacocoTestReport')
}

tasks.named('spotlessApply') {
    enabled = false
}

tasks.withType(com.diffplug.gradle.spotless.SpotlessApply).configureEach {
    enabled = false
}

tasks.withType(JavaCompile).configureEach {
    options.errorprone {
        check('NullAway', net.ltgt.gradle.errorprone.CheckSeverity.ERROR)
        excludedPaths = '.*/build/generated-sources/.*'
        option('NullAway:AnnotatedPackages', 'shop.auto.api')
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

version = '0.0.1-SNAPSHOT'
