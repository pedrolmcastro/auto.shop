plugins {
    id 'checkstyle'
    id 'com.diffplug.spotless' version '8.10.4'
    id 'com.github.spotbugs' version '6.5.13'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id 'java'
    id 'net.ltgt.errorprone' version '5.1.1'
    id "org.sonarqube" version "7.5.0.8588"
    id 'org.springframework.boot' version '4.1.2'
}

group = 'shop.auto'
version = '0.0.1-SNAPSHOT'

sourceSets {
    integrationTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    compileOnly 'org.jspecify:jspecify:1.0.0'
    errorprone 'com.google.errorprone:error_prone_core:2.48.0'
    errorprone 'com.uber.nullaway:nullaway:0.14.1'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    spotbugsPlugins 'com.h3xstream.findsecbugs:findsecbugs-plugin:1.14.0'
    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'net.minidev', module: 'json-smart'
    }
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

configurations.configureEach {
    resolutionStrategy.eachDependency {
        if (it.requested.group == 'com.google.guava' && it.requested.name == 'guava') {
            it.useVersion '33.7.2-jre'
            it.because 'Fixes CVE-2026-102554'
        }
        if (
            it.requested.group == 'ch.qos.logback' &&
            (it.requested.name == 'logback-classic' || it.requested.name == 'logback-core')
        ) {
            it.useVersion '1.6.5'
            it.because 'Fixes CVE-2026-104721'
        }
    }
}

repositories {
    mavenCentral()
}

checkstyle {
    toolVersion = '14.3.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

jacoco {
    toolVersion = '0.8.16'
}

sonar {
  properties {
    property "sonar.organization", "pedrolmcastro"
    property "sonar.projectKey", "pedrolmcastro_auto.shop"
    property "sonar.projectName", "api.auto.shop"
    property "sonar.coverage.jacoco.xmlReportPaths", layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml').get().asFile.absolutePath
  }
}

spotbugs {
    toolVersion = '4.10.5'
}

spotless {
    java {
        eclipse('4.41').configFile('config/formatter/java-formatter.xml')
        lineEndings com.diffplug.spotless.LineEnding.UNIX
        target 'src/**/*.java'
        trimTrailingWhitespace()
    }
}

tasks.withType(com.diffplug.gradle.spotless.SpotlessApply).configureEach {
    enabled = false
}

tasks.withType(JavaCompile).configureEach {
    options.errorprone {
        check('NullAway', net.ltgt.gradle.errorprone.CheckSeverity.ERROR)
        option('NullAway:AnnotatedPackages', 'shop.auto.api')
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.register('integrationTest', Test) {
    classpath = sourceSets.integrationTest.runtimeClasspath
    description = 'Runs integration tests.'
    group = 'verification'
    shouldRunAfter tasks.named('test')
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
}

tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}

tasks.named('check') {
    dependsOn tasks.named('integrationTest')
    dependsOn tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport', JacocoReport) {
    dependsOn tasks.named('test'), tasks.named('integrationTest')
    executionData tasks.named('test').get(), tasks.named('integrationTest').get()
    reports {
        html.required = true
        xml.required = true
    }
}

tasks.named('sonar') {
    dependsOn tasks.named('jacocoTestReport')
}

tasks.named('spotlessApply') {
    enabled = false
}
