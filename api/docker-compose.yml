---
name: api-auto-shop
services:
  app:
    build:
      context: .
      target: runtime
    cap_drop: [ALL]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD in .env}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/api_auto_shop
      SPRING_DATASOURCE_USERNAME: api_auto_shop
    init: true
    ports:
      - 127.0.0.1:${PORT:-8080}:8080
    security_opt:
      - no-new-privileges:true
    volumes:
      - pepper:/app/secrets
  postgres:
    environment:
      POSTGRES_DB: api_auto_shop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD in .env}
      POSTGRES_USER: api_auto_shop
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 10s
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      timeout: 5s
    image: postgres:18.6
    volumes:
      - postgres-data:/var/lib/postgresql
volumes:
  pepper: {}
  postgres-data: {}
