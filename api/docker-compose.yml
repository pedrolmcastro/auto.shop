---
name: api-auto-shop
services:
  app:
    build:
      context: .
      target: runtime
    init: true
    ports:
      - ${PORT:-8080}:8080
  checks:
    build:
      context: .
      target: checks
    init: true
    profiles: [quality]
    volumes:
      - gradle-cache:/home/app/.gradle
volumes:
  gradle-cache: {}
